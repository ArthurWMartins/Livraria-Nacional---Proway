<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livraria Nacional - Reserva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="index.html">Livraria Nacional</a>

            <nav class="main-nav">
                <a href="index.html">Início</a>
                <a href="menu.html">Menu</a>
                <a href="reserva.html" aria-current="page">Reserva</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="reservation">
            <div class="container reservation-content">

                <div class="section-heading">
                    <p class="eyebrow">Reserve seu livro</p>

                    <h1>Faça sua reserva</h1>

                    <p>
                        Preencha o formulário abaixo para reservar
                        seu livro na Livraria Nacional.
                    </p>
                </div>

                <form class="reservation-form">

                    <div class="form-group">
                        <label for="name">Nome completo</label>
                        <input type="text" id="name" name="name" placeholder="Digite seu nome" required>
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                    </div>

                    <div class="form-group">
                        <label for="phone">Telefone</label>
                        <input type="tel" id="phone" name="phone" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="form-group">
                        <label for="book">Livro desejado</label>
                        <input type="text" id="book" name="book" placeholder="Digite o nome do livro" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoria</label>

                        <select id="category" name="category" required>
                            <option value="">Selecione uma categoria</option>
                            <option value="romance">Romance</option>
                            <option value="fantasia">Fantasia</option>
                            <option value="mangas">Mangás</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Data para retirada</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Observações</label>
                        <textarea id="message" name="message" rows="5" placeholder="Digite alguma observação"></textarea>
                    </div>

                    <button class="button button-primary" type="submit">
                        Fazer Reserva
                    </button>

                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                <strong>Livraria Nacional</strong>
            </p>

            <p>© 2026 Livraria Nacional</p>
        </div>
    </footer>

</body>

</html>
